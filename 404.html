<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found - CGMT</title>
    <style>
      body {
        background: #11131a;
        color: #f4f4f5;
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 520px;
        padding: 32px;
        text-align: center;
      }

      a {
        color: #64d2ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>This mirrored static page does not exist yet.</p>
      <p><a id="home-link" href="cgmtlobby.com/index.html">Return home</a></p>
    </main>
    <script>
      var parts = location.pathname.split("/").filter(Boolean);
      var repoPrefix = parts.length > 1 ? "/" + parts[0] + "/" : "/";
      document.getElementById("home-link").href = repoPrefix + "cgmtlobby.com/index.html";
    </script>
  </body>
</html>
